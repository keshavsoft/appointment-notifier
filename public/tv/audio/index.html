<!doctype html>
<html lang="te">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#07111e">
  <title>CareCall | తెలుగు ఆడియో లైబ్రరీ</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      background: #06101c; color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Telugu", sans-serif;
    }
    .container {
      max-width: 900px; margin: 0 auto; padding: 24px 20px;
    }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #1e293b;
    }
    .back-btn {
      text-decoration: none; background: #1e293b; color: #38bdf8;
      padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 14px;
      border: 1px solid #334155;
    }
    .back-btn:hover { background: #334155; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { color: #94a3b8; margin: 0 0 20px; font-size: 15px; }
    .status-bar {
      background: #0f172a; border: 2px solid #38bdf8; border-radius: 12px;
      padding: 12px 20px; font-weight: 700; color: #38bdf8; margin-bottom: 20px;
      text-align: center; font-size: 16px;
    }
    .section-title {
      font-size: 18px; font-weight: 800; color: #60a5fa; margin: 24px 0 12px;
    }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px;
    }
    .audio-btn {
      background: #172d42; border: 1px solid #334e68; border-radius: 10px;
      color: #ffffff; padding: 12px 6px; font-size: 16px; font-weight: 800;
      cursor: pointer; transition: transform 0.12s, background 0.12s; text-align: center;
    }
    .audio-btn:hover, .audio-btn:focus {
      background: #0284c7; transform: scale(1.08); outline: 2px solid #38bdf8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <span style="font-weight: 800; color: #38bdf8;">CareCall TV</span>
        <span style="color: #64748b; margin-left: 6px;">/ ఆడియో లైబ్రరీ</span>
      </div>
      <a href="/tv/" class="back-btn">← 📺 టీవీ మెనూకి వెళ్ళండి</a>
    </div>

    <h1>తెలుగు వాయిస్ ఫైల్స్ లైబ్రరీ</h1>
    <p>ఏదైనా బటన్ క్లిక్ చేసి ఆడియో సౌండ్‌ని వినండి.</p>

    <div class="status-bar" id="statusBar">సిద్ధంగా ఉంది · ఏదైనా నంబర్ నొక్కండి</div>

    <div class="section-title">సింగిల్ నంబర్లు (01.wav - 10.wav)</div>
    <div class="grid" id="wavGrid"></div>

    <div class="section-title">రెండు అంకెల నంబర్లు (11.mp3 - 99.mp3)</div>
    <div class="grid" id="mp3Grid"></div>
  </div>

  <script>
    (function() {
      var statusBar = document.getElementById("statusBar");
      var wavGrid = document.getElementById("wavGrid");
      var mp3Grid = document.getElementById("mp3Grid");
      var audioCtx = null;

      function play(filename, label) {
        if (!audioCtx) {
          var Audio = window.AudioContext || window.webkitAudioContext;
          if (Audio) audioCtx = new Audio();
        }
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();

        statusBar.textContent = "🔊 ప్లే అవుతోంది: " + label + " (" + filename + ")";
        var url = "/tv/audio/te/" + filename;

        fetch(url)
          .then(function(r) { return r.arrayBuffer(); })
          .then(function(buf) { return audioCtx.decodeAudioData(buf); })
          .then(function(decoded) {
            var src = audioCtx.createBufferSource();
            src.buffer = decoded;
            src.connect(audioCtx.destination);
            src.onended = function() {
              statusBar.textContent = "✅ " + label + " ప్లేబ్యాక్ పూర్తయింది";
            };
            src.start(0);
          })
          .catch(function(err) {
            statusBar.textContent = "ఆడియో లోడ్ కాలేదు: " + err.message;
          });
      }

      for (var i = 1; i <= 10; i++) {
        (function(num) {
          var fn = (num < 10 ? "0" : "") + num + ".wav";
          var btn = document.createElement("button");
          btn.className = "audio-btn";
          btn.textContent = num;
          btn.onclick = function() { play(fn, "నంబర్ " + num); };
          wavGrid.appendChild(btn);
        })(i);
      }

      for (var j = 11; j <= 99; j++) {
        (function(num) {
          var fn = num + ".mp3";
          var btn = document.createElement("button");
          btn.className = "audio-btn";
          btn.textContent = num;
          btn.onclick = function() { play(fn, "నంబర్ " + num); };
          mp3Grid.appendChild(btn);
        })(j);
      }
    })();
  </script>
</body>
</html>
