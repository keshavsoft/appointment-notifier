<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071426">
  <title>Waiting Area Display | CareCall</title>
  <link rel="stylesheet" href="/v1/css/style.css">
</head>
<body class="screen-page display-screen">
  <header class="screen-header"><div class="screen-brand"><span class="brand-mark">✚</span> CareCall</div><div class="screen-status"><i></i><span id="screenConnection">Connecting</span></div></header>
  <main class="screen-content">
    <p class="screen-kicker">PLEASE PROCEED WHEN YOUR NAME IS CALLED</p>
    <div class="screen-orb">✦</div>
    <p class="screen-label">DOCTOR'S ANNOUNCEMENT</p>
    <h1 id="screenMessage" class="screen-message">Welcome</h1>
    <p id="screenHint" class="screen-hint">Please wait for the doctor's instructions.</p>
    <div class="elapsed"><span class="elapsed-dot"></span><span>Since announcement</span><strong id="elapsedTime">—</strong></div>
  </main>
  <footer class="screen-footer"><span>PLEASE KEEP THE AREA QUIET</span><button id="enableAudio" type="button">Enable voice announcements</button></footer>
  <script type="module" src="/v1/js/display.js"></script>
</body>
</html>
