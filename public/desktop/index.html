<!doctype html>
<html lang="te">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07131d">
  <title>డాక్టర్ డెస్క్‌టాప్ కన్సోల్ | CareCall V1</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% -10%, rgba(56, 189, 248, 0.16), transparent 40%),
                  linear-gradient(165deg, #07131d 0%, #0b1926 55%, #07111a 100%);
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; min-height: 100vh;
      -webkit-user-select: none; user-select: none;
    }

    header {
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px;
      background: rgba(15, 23, 42, 0.85);
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
    }
    .brand { font-size: 1.15rem; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .brand span { color: #34d399; }
    .nav-links { display: flex; gap: 10px; }
    .nav-btn {
      text-decoration: none; color: #cbd5e1; background: #1e293b;
      padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 0.85rem;
      border: 1px solid #334e68; display: inline-flex; align-items: center; gap: 6px;
      transition: background 0.15s, border-color 0.15s;
    }
    .nav-btn:hover { background: #0284c7; border-color: #38bdf8; color: #fff; }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px;
      align-items: center;
    }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
    }

    .panel {
      background: rgba(15, 23, 42, 0.88);
      border: 2px solid rgba(148, 163, 184, 0.22);
      border-radius: 24px;
      padding: 28px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      padding-bottom: 12px;
    }
    .panel-title { font-size: 1.15rem; font-weight: 800; color: #38bdf8; margin: 0; }

    .status-pill {
      font-size: 0.78rem; font-weight: 700; padding: 4px 12px; border-radius: 999px;
      background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(148, 163, 184, 0.25);
      display: inline-flex; align-items: center; gap: 6px; color: #94a3b8;
    }
    .status-pill i { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
    .status-pill.ok { color: #6ee7b7; border-color: rgba(52, 211, 153, 0.4); }
    .status-pill.ok i { background: #34d399; box-shadow: 0 0 8px #34d399; }

    .number-display {
      min-height: 85px; display: grid; place-items: center;
      font-size: 4.2rem; font-weight: 900; color: #ffffff;
      border-bottom: 2px solid rgba(56, 189, 248, 0.3); margin-bottom: 16px;
      letter-spacing: -1px; text-shadow: 0 4px 20px rgba(56, 189, 248, 0.3);
    }

    .keypad {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 12px; margin-bottom: 16px;
    }
    .keypad button {
      aspect-ratio: 1.45 / 1; min-height: 52px;
      border: 1px solid rgba(148, 163, 184, 0.24); border-radius: 14px;
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
      color: #ffffff; font-size: 1.5rem; font-weight: 800; cursor: pointer;
      transition: transform 0.1s, background 0.1s;
    }
    .keypad button:active { transform: scale(0.95); background: #0284c7; }
    .keypad .btn-clear { color: #f59e0b; }
    .keypad .btn-back { color: #38bdf8; }

    .call-btn {
      width: 100%; min-height: 54px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: white; border: 0; border-radius: 14px;
      font-size: 1.1rem; font-weight: 800; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; box-shadow: 0 8px 24px rgba(2, 132, 199, 0.4);
      transition: transform 0.1s, opacity 0.2s;
    }
    .call-btn:active:not(:disabled) { transform: scale(0.98); }
    .call-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Mirror Live Card */
    .mirror-body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 24px 0;
    }
    .mirror-token {
      font-size: 6rem; font-weight: 900; color: #ffffff; margin: 0; line-height: 1;
      text-shadow: 0 10px 40px rgba(56, 189, 248, 0.4);
    }
    .mirror-telugu {
      font-size: 1.8rem; font-weight: 800; color: #60a5fa; margin: 12px 0 24px;
    }
    .mirror-meta {
      width: 100%; background: rgba(7, 17, 29, 0.8);
      border: 1px solid #334e68; border-radius: 14px; padding: 14px 18px;
      display: flex; justify-content: space-between; font-size: 0.9rem; color: #94a3b8;
    }
    .mirror-meta b { color: #38bdf8; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>✚</span> CareCall V1 / డాక్టర్ డెస్క్‌టాప్
    </div>
    <div class="nav-links">
      <a href="/mobile/" class="nav-btn">📱 మొబైల్ కీప్యాడ్</a>
      <a href="/tv/" class="nav-btn">📺 టీవీ స్క్రీన్</a>
      <a href="/" class="nav-btn">🏠 హోమ్</a>
    </div>
  </header>

  <main>
    <!-- Left: Doctor Keypad -->
    <section class="panel">
      <div class="panel-header">
        <h2 class="panel-title">కన్సల్టేషన్ కీప్యాడ్</h2>
        <span class="status-pill" id="connStatus"><i></i>కనెక్ట్ అవుతోంది…</span>
      </div>

      <output class="number-display" id="dialedNumber">—</output>

      <div class="keypad">
        <button type="button" data-digit="1">1</button>
        <button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button>
        <button type="button" data-digit="4">4</button>
        <button type="button" data-digit="5">5</button>
        <button type="button" data-digit="6">6</button>
        <button type="button" data-digit="7">7</button>
        <button type="button" data-digit="8">8</button>
        <button type="button" data-digit="9">9</button>
        <button type="button" class="btn-clear" id="btnClear">C</button>
        <button type="button" data-digit="0">0</button>
        <button type="button" class="btn-back" id="btnBack">⌫</button>
      </div>

      <button class="call-btn" id="btnCall" type="button" disabled>
        <span>డిస్‌ప్లేకి పంపండి</span><b>→</b>
      </button>
    </section>

    <!-- Right: Live TV Screen Mirror -->
    <section class="panel">
      <div class="panel-header">
        <h2 class="panel-title">టీవీ లైవ్ ప్రివ్యూ మిర్రర్</h2>
        <span class="status-pill ok"><i></i>లైవ్ సింక్</span>
      </div>

      <div class="mirror-body">
        <div class="mirror-token" id="mirrorToken">--</div>
        <div class="mirror-telugu" id="mirrorTelugu">కాల్ కోసం వేచి ఉంది…</div>

        <div class="mirror-meta">
          <span>గది: <b>రూమ్ 1</b></span>
          <span id="mirrorElapsed">సమయం: <b>వేచి ఉంది</b></span>
        </div>
      </div>
    </section>
  </main>

  <script>
  (function () {
    "use strict";

    var dialedNumber = document.getElementById("dialedNumber");
    var btnCall = document.getElementById("btnCall");
    var btnClear = document.getElementById("btnClear");
    var btnBack = document.getElementById("btnBack");
    var connStatus = document.getElementById("connStatus");
    var mirrorToken = document.getElementById("mirrorToken");
    var mirrorTelugu = document.getElementById("mirrorTelugu");
    var mirrorElapsed = document.getElementById("mirrorElapsed");

    var currentDigits = "";
    var socket = null;
    var isConnected = false;
    var activeCall = null;

    var TELUGU_UNITS = [
      "సున్నా", "ఒకటి", "రెండు", "మూడు", "నాలుగు", "ఐదు",
      "ఆరు", "ఏడు", "ఎనిమిది", "తొమ్మిది", "పది",
      "పదకొండు", "పన్నెండు", "పదమూడు", "పద్నాలుగు", "పదిహేను",
      "పదహారు", "పదిహేడు", "పద్దెనిమిది", "పంతొమ్మిది"
    ];

    var TELUGU_TENS = [
      "", "", "ఇరవై", "ముప్పై", "నలభై", "యాభై",
      "అరవై", "డెబ్బై", "ఎనభై", "తొంభై"
    ];

    function numberToTeluguWords(num) {
      var n = Math.floor(Number(num));
      if (!isFinite(n) || n < 0 || n > 999) return String(num);
      if (n < 20) return TELUGU_UNITS[n];
      if (n < 100) {
        var tens = Math.floor(n / 10);
        var rem = n % 10;
        return rem === 0 ? TELUGU_TENS[tens] : (TELUGU_TENS[tens] + " " + TELUGU_UNITS[rem]);
      }
      var hundreds = Math.floor(n / 100);
      var rem100 = n % 100;
      var hundredText = hundreds === 1 ? "వంద" : (TELUGU_UNITS[hundreds] + " వందల");
      if (rem100 === 0) return hundredText;
      return hundredText + " " + numberToTeluguWords(rem100);
    }

    function setStatus(text, ok) {
      connStatus.classList.remove("ok");
      if (ok) connStatus.classList.add("ok");
      connStatus.lastChild.textContent = text;
    }

    function updateKeypad() {
      dialedNumber.textContent = currentDigits || "—";
      btnCall.disabled = (!currentDigits || !isConnected);
    }

    function updateMirror() {
      if (!activeCall || !activeCall.number) {
        mirrorToken.textContent = "--";
        mirrorTelugu.textContent = "కాల్ కోసం వేచి ఉంది…";
        mirrorElapsed.innerHTML = "సమయం: <b>వేచి ఉంది</b>";
        return;
      }
      mirrorToken.textContent = activeCall.number;
      var n = Number(activeCall.number);
      mirrorTelugu.textContent = (isFinite(n) && n >= 0) ? numberToTeluguWords(n) : "";
      var sec = Math.max(0, Math.floor((Date.now() - (activeCall.sentAt || Date.now())) / 1000));
      mirrorElapsed.innerHTML = "పిలవబడింది: <b>" + sec + "సె క్రితం</b>";
    }

    function connect() {
      var protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      socket = new WebSocket(protocol + "//" + window.location.host + "/ws");

      socket.onopen = function () {
        isConnected = true;
        setStatus("సర్వర్ కనెక్ట్ అయింది", true);
        updateKeypad();
      };

      socket.onclose = function () {
        isConnected = false;
        setStatus("డిస్‌కనెక్ట్ అయింది", false);
        updateKeypad();
        setTimeout(connect, 2000);
      };

      socket.onmessage = function (event) {
        var data;
        try { data = JSON.parse(event.data); } catch (e) { return; }
        if (data.type === "state" && data.announcement && data.announcement.number) {
          activeCall = data.announcement;
          updateMirror();
        }
      };
    }

    document.querySelectorAll("[data-digit]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (currentDigits.length < 3) {
          currentDigits += btn.getAttribute("data-digit");
          updateKeypad();
        }
      });
    });

    btnClear.addEventListener("click", function () {
      currentDigits = "";
      updateKeypad();
    });

    btnBack.addEventListener("click", function () {
      currentDigits = currentDigits.slice(0, -1);
      updateKeypad();
    });

    btnCall.addEventListener("click", function () {
      if (!currentDigits || !socket || socket.readyState !== 1) return;
      socket.send(JSON.stringify({ type: "call", number: currentDigits }));
      currentDigits = "";
      updateKeypad();
    });

    setInterval(updateMirror, 1000);
    connect();
  })();
  </script>
</body>
</html>
