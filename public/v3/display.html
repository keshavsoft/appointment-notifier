<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111d">
  <title>CareCall Display V3</title>
  <link rel="stylesheet" href="/v3/css/v3.css">
</head>
<body class="v3-display-page">
  <main class="display-view display-fullscreen" id="displayView" data-display-view aria-label="Current number and elapsed time">
    <div class="display-number" data-display-number aria-live="polite">—</div>
    <p class="display-elapsed" data-display-elapsed aria-live="off">Waiting for next call</p>
  </main>
  <button class="voice-button" id="enableVoice" type="button">Enable voice</button>
  <script type="module" src="/v3/js/display.js"></script>
</body>
</html>
