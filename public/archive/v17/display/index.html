<!doctype html>
<html lang="te">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111d">
  <title>CareCall Display V17 — తెలుగు</title>
  <link rel="stylesheet" href="./css/style.css?v=17.0">
</head>
<body class="v17-display-page" id="displayApp">
  <header style="position: absolute; top: 12px; right: 16px; z-index: 100; display: flex; gap: 8px;">
    <a href="/v17/" style="text-decoration: none; color: #38bdf8; background: #0f172a; padding: 6px 12px; border-radius: 8px; border: 1px solid #334155; font-size: 0.85rem; font-weight: 600;">📂 V17</a>
    <a href="/versions/" style="text-decoration: none; color: #94a3b8; background: #0f172a; padding: 6px 12px; border-radius: 8px; border: 1px solid #334155; font-size: 0.85rem; font-weight: 600;">🗂️ వర్షన్లు</a>
    <a href="/" style="text-decoration: none; color: #94a3b8; background: #0f172a; padding: 6px 12px; border-radius: 8px; border: 1px solid #334155; font-size: 0.85rem; font-weight: 600;">🏠 హోమ్</a>
  </header>
  <main class="display-view display-fullscreen" id="displayView" data-display-view aria-label="ప్రస్తుత నంబర్ మరియు గడిచిన సమయం">
    <div class="display-number-card">
      <div class="display-number" data-display-number aria-live="polite"></div>
      <div class="display-telugu-spelling" data-display-spelling aria-live="polite"></div>
    </div>
    <p class="display-elapsed" data-display-elapsed aria-live="off">తదుపరి కాల్ కోసం వేచి ఉంది</p>
  </main>
  <div id="connectionStatus" class="display-connection-status" role="status">సర్వర్‌కి కనెక్ట్ అవుతోంది…</div>
  <section class="voice-controls" aria-label="డిస్‌ప్లే వాయిస్ సెట్టింగ్‌లు">
    <button class="voice-button" id="voiceToggle" type="button" aria-pressed="false">వాయిస్ ఆఫ్</button>
    <button class="voice-test-button" id="testVoice" type="button" disabled>వాయిస్ టెస్ట్</button>
    <span class="voice-status" id="voiceStatus" role="status" aria-live="polite">వాయిస్ ఆఫ్ చేయబడింది</span>
  </section>
  <script src="./display.js?v=17.1" defer></script>
</body>
</html>
