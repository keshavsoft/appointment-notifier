<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareCall V20 Doctor Console (Preview)</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: system-ui, sans-serif;
      background: #07131d;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
    }
    .box {
      max-width: 600px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(168, 85, 247, 0.2);
      color: #d8b4fe;
      border: 1px solid rgba(168, 85, 247, 0.4);
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    h1 { margin: 0 0 16px; font-size: 2rem; }
    p { color: #94a3b8; line-height: 1.6; margin-bottom: 30px; font-size: 1.05rem; }
    .nav-links { display: flex; gap: 12px; justify-content: center; }
    a {
      text-decoration: none;
      color: #38bdf8;
      background: #1e293b;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600;
      border: 1px solid #334155;
    }
    a:hover { background: #334155; }
  </style>
</head>
<body>
  <div class="box">
    <span class="badge">V20 Planned Roadmap</span>
    <h1>👨‍⚕️ V20 Doctor Console</h1>
    <p>
      Multi-room consultation keypad, patient priority assignment, and department routing. Planned for release following V19.
    </p>
    <div class="nav-links">
      <a href="/v20/">← V20 Menu</a>
      <a href="/versions/">🗂️ Versions</a>
      <a href="/">🏠 Home</a>
    </div>
  </div>
</body>
</html>
