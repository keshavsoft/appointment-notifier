<!doctype html>
<html lang="te">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07131d">
  <title>డాక్టర్ కన్సోల్ | CareCall Mobile</title>
  <link rel="stylesheet" href="./style.css?v=1">
</head>
<body>
  <main class="mobile-app" id="doctorApp">
    <header class="mobile-header">
      <div>
        <p class="brand">Care<span>Call</span></p>
        <h1>డాక్టర్ కన్సోల్</h1>
      </div>
      <a class="desktop-link" href="/desktop/doctor/?view=desktop" aria-label="డెస్క్‌టాప్ వెర్షన్">🖥️</a>
    </header>

    <section class="status-row" aria-label="కనెక్షన్ స్థితి">
      <span class="status-pill" id="serverStatus"><i></i>కనెక్ట్ అవుతోంది…</span>
      <span class="status-pill" id="displayStatus"><i></i>డిస్‌ప్లే ఆఫ్‌లైన్</span>
    </section>

    <section class="call-card">
      <label class="selected-label" for="selectedNumber">పిలవవలసిన నంబర్</label>
      <output class="selected-number" id="selectedNumber" aria-live="polite">—</output>

      <div class="keypad" aria-label="కీప్యాడ్">
        <button type="button" data-digit="1">1</button>
        <button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button>
        <button type="button" data-digit="4">4</button>
        <button type="button" data-digit="5">5</button>
        <button type="button" data-digit="6">6</button>
        <button type="button" data-digit="7">7</button>
        <button type="button" data-digit="8">8</button>
        <button type="button" data-digit="9">9</button>
        <button type="button" class="key-clear" data-action="clear" aria-label="నంబర్ తొలగించు">C</button>
        <button type="button" data-digit="0">0</button>
        <button type="button" class="key-back" data-action="backspace" aria-label="చివరి అంకె తొలగించు">⌫</button>
      </div>

      <button class="send-button" id="sendCall" type="button" disabled>
        <span>డిస్‌ప్లేకి పంపండి</span><b aria-hidden="true">→</b>
      </button>
      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    </section>

    <nav class="mobile-nav" aria-label="మూల మార్గాలు">
      <a href="/mobile/doctor/">📞 <span>కాల్</span></a>
      <a href="/tv/">📺 <span>టీవీ</span></a>
      <a href="/">🏠 <span>హోమ్</span></a>
    </nav>
  </main>

  <script type="module" src="./app.js?v=1"></script>
</body>
</html>
