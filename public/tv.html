<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telugu Audio Volume Test</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: 32px;
    }

    button {
      display: inline-block;
      margin: 12px;
      padding: 20px 30px;
      font-size: 22px;
      border: 0;
      border-radius: 10px;
      background: #1769d2;
      color: white;
    }

    #status {
      margin-top: 25px;
      color: #9ed0ff;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <h1>Telugu Audio Volume Test</h1>
  <p>Source: /1.wav</p>

  <div id="buttons"></div>

  <button onclick="stopAudio()">STOP</button>

  <div id="status">Loading audio...</div>

  <script>
    const audioUrl = "/1.wav";

    const levels = [
      { label: "Original · 100%", gain: 1.0 },
      { label: "Slightly louder · 125%", gain: 1.25 },
      { label: "Medium · 150%", gain: 1.5 },
      { label: "Loud · 175%", gain: 1.75 },
      { label: "Very loud · 200%", gain: 2.0 }
    ];

    let audioContext;
    let audioBuffer;
    let currentSource;

    async function loadAudio() {
      try {
        const AudioContextClass =
          window.AudioContext || window.webkitAudioContext;

        audioContext = new AudioContextClass();

        const response = await fetch(audioUrl);

        if (!response.ok) {
          throw new Error("Could not load " + audioUrl);
        }

        const data = await response.arrayBuffer();

        audioBuffer = await audioContext.decodeAudioData(data);

        document.getElementById("status").textContent =
          "Audio ready. Select a volume level.";

        renderButtons();

      } catch (error) {
        document.getElementById("status").textContent =
          "Audio loading failed: " + error.message;
      }
    }

    function renderButtons() {
      const container = document.getElementById("buttons");

      levels.forEach(level => {
        const button = document.createElement("button");

        button.textContent = level.label;

        button.onclick = () => playAudio(level.gain);

        container.appendChild(button);
      });
    }

    async function playAudio(volume) {
      stopAudio();

      await audioContext.resume();

      currentSource = audioContext.createBufferSource();

      const gainNode = audioContext.createGain();

      currentSource.buffer = audioBuffer;
      gainNode.gain.value = volume;

      currentSource.connect(gainNode);
      gainNode.connect(audioContext.destination);

      currentSource.onended = () => {
        currentSource = null;
        document.getElementById("status").textContent = "Finished.";
      };

      currentSource.start(0);

      document.getElementById("status").textContent =
        "Playing at " + Math.round(volume * 100) + "%";
    }

    function stopAudio() {
      if (currentSource) {
        try {
          currentSource.stop();
        } catch (error) { }

        currentSource = null;
      }

      document.getElementById("status").textContent = "Stopped.";
    }

    loadAudio();
  </script>

</body>

</html>
