<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071426">
  <title>Reception Calling Screen | CareCall</title>
  <link rel="stylesheet" href="/v1/css/style.css">
</head>
<body class="screen-page reception-screen">
  <header class="screen-header"><div class="screen-brand"><span class="brand-mark">✚</span> CareCall <span class="screen-section">/ RECEPTION</span></div><div class="screen-status"><i></i><span id="screenConnection">Connecting</span></div></header>
  <main class="screen-content reception-content">
    <p class="screen-kicker">NOW SERVING</p>
    <p class="screen-label">PLEASE PROCEED TO THE RECEPTION COUNTER</p>
    <div class="number-frame"><span id="screenMessage" class="reception-number">—</span></div>
    <p id="screenHint" class="screen-hint">Your number will appear here when called.</p>
    <div class="elapsed"><span class="elapsed-dot"></span><span>Called</span><strong id="elapsedTime">—</strong><span>ago</span></div>
  </main>
  <footer class="screen-footer"><span>PLEASE HAVE YOUR APPOINTMENT DETAILS READY</span><button id="enableAudio" type="button">Enable voice announcements</button></footer>
  <script type="module" src="/v1/js/reception.js"></script>
</body>
</html>
